[package]
name = "faunus"
version = "3.0.0-beta.2"
edition = "2021"
description = "Monte Carlo and Langevin dynamics for coarse-grained (bio)molecular simulation"
license = "Apache-2.0"
repository = "https://github.com/mlund/faunus-rs"
documentation = "https://mlund.github.io/faunus-rs/"
readme = "README.md"

[[bin]]
name = "faunus"
path = "src/bin/faunus.rs"
required-features = ["cli"]

[lib]

[dependencies]
anyhow = "1.0"
average = { version = "0.13", default-features = false, features = ["std", "serde1"] }
derive-getters = "0.3.0"
derive_builder = "0.20.0"
derive_more = { version = "1.0.0", default-features = false, features = ["debug"] }
dyn-clone = "1.0.17"
exmex = { version = "0.20", features = ["value"] }
flate2 = "1.0.35"
icotable = { git = "https://github.com/mlund/icotable.git" }
interatomic = { git = "https://github.com/mlund/interatomic.git", features = ["serde", "custom", "gpu"] }
itertools = "0.10"
log = "0.4"
minijinja = { version = "2.18", default-features = false, features = ["builtins", "loop_controls", "serde"] }
molly = "0.5"
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
paste = "1.0"
physical_constants = "0.5.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_with = "3.8.1"
serde_yml = { version = "0.10.4", package = "yaml_serde" }
thiserror = "2"
typetag = "0.2"
unordered-pair = { version = "0.2.4", features = ["serde"] }
validator = { version = "0.20", features = ["derive"] }
voronota-ltr = { version = "0.7", default-features = false }

# CLI-only dependencies
bytemuck = { version = "1", features = ["derive"], optional = true }
clap = { version = "4.0", features = ["derive"], optional = true }
# Only the wgpu runtime is used; the `cpu` backend pulls an MLIR/LLVM toolchain
# (tracel-mlir-sys/tblgen) that cannot build in manylinux/cross wheel environments.
cubecl = { version = "0.9", features = ["wgpu"], optional = true }
indicatif = { version = "*", optional = true }
pretty_env_logger = { version = "0.5", optional = true }

# On wasm32-unknown-unknown, std::time::Instant::now() panics; web-time reads the
# browser clock there and re-exports std::time::Instant on every other target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[build-dependencies]
# Embed the git revision into the binary for reproducible `output.yaml` headers.
vergen-gitcl = "1"

[dev-dependencies]
approx = "0.5"
float-cmp = "0.9"
tempfile = "3"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:pretty_env_logger", "dep:indicatif"]
gpu = ["dep:cubecl", "dep:bytemuck"]

#lto = "thin"

