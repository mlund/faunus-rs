{# Electric double layer: osmotic pressure between two uniformly charged planes, after
   Guldbrand et al., J. Chem. Phys. 80, 2221 (1984), doi:10.1063/1.446912.
   The defaults follow their Table I: σ = 0.2244 C/m², counterions carrying 80 e in total,
   T = 298 K (ε_r·T = 2.327×10⁴ K) and 2a = 21 Å, with the electrically transparent midplane
   wall of their Fig. 1c. tests/double_layer.rs checks P_osm against that table.

   A 2 Na⁺ ⇌ Ca²⁺ swap with reaction free energy dG (kJ/mol) sets the counterion valency:
   high dG gives 80 Na⁺, low dG gives 40 Ca²⁺, and values in between give mixtures. The swap
   conserves charge, so σ stays fixed. Each species has one group per half, held on its side
   of the midplane, so each half stays neutral. For the divalent attraction, set lz = 12 and
   a low dG.

   Edit the defaults below, or set a variable ahead of them ({% set dG = -50.0 %}); faunus
   renders the template without external variables. Method: docs/analysis.md
   (DoubleLayerPressure). #}
{%- set sigma        = sigma        | default(0.014006) %}   {# |σ| e/Å² (0.2244 C/m²) #}
{%- set total_charge = total_charge | default(80) %}         {# total counterion charge (multiple of 4) #}
{%- set lz           = lz           | default(21.0) %}       {# plate separation 2a (Å) #}
{%- set dG           = dG           | default(20.0) %}       {# 2Na⁺⇌Ca²⁺ free energy (kJ/mol); high → mono #}
{%- set eps_r        = eps_r        | default(78.05) %}      {# ε_r·T = 2.327e4 K at 298.15 K #}
{%- set steps        = steps        | default(20000) %}      {# MC steps per run (use two runs: equilibrate, then sample) #}
{%- set k        = (total_charge / 2) | int %}              {# Na⁺ per half (= Ca²⁺ slots ×2) #}
{%- set ca_slots = (total_charge / 4) | int %}              {# max Ca²⁺ per half #}
{%- set side     = (total_charge / (2.0 * sigma)) ** 0.5 %} {# square box from electroneutrality 2σ·area = total_charge #}
{%- set c_wall   = -4.0 * 1389.3545764438197 / eps_r * sigma %}   {# Eq. 9 wall-potential prefactor: -4·(Coulomb prefactor)·σ #}
{%- set dp       = (lz / 4.0) | round(2) %}

atoms:
  - { name: Na, charge: 1.0, sigma: 0.0, mass: 23.0 }
  - { name: Ca, charge: 2.0, sigma: 0.0, mass: 40.0 }
molecules:
  - { name: na_lo, atoms: [Na] }
  - { name: na_up, atoms: [Na] }
  - { name: ca_lo, atoms: [Ca] }
  - { name: ca_up, atoms: [Ca] }

system:
  cell: !Slit [{{ side }}, {{ side }}, {{ lz }}]
  medium: { permittivity: !Fixed {{ eps_r }}, temperature: 298.15 }
  energy:
    - !Nonbonded
      default:
        - !Coulomb { cutoff: {{ (side * 10.0) | round(3) }} }   # full minimum-image, no Ewald
      # Smeared charged walls (finite charged-square sheet, Guldbrand Eq. 9).
    - !CustomExternal
        selection: "all"
        constants: { c: {{ c_wall }}, b: {{ side / 2.0 }}, hg: {{ lz / 2.0 }} }
        function: >-
          c * q * (
          2*b*asinh(b/sqrt(b*b+(z+hg)*(z+hg)))
          - (z+hg)*atan(b*b/((z+hg)*sqrt(2*b*b+(z+hg)*(z+hg))))
          + 2*b*asinh(b/sqrt(b*b+(hg-z)*(hg-z)))
          - (hg-z)*atan(b*b/((hg-z)*sqrt(2*b*b+(hg-z)*(hg-z))))
          )
      # Transparent midplane wall: hold each half's groups on its side.
    - !CustomExternal { selection: "molecule na_lo ca_lo", function: "1000000.0 if z > 0 else 0.0" }
    - !CustomExternal { selection: "molecule na_up ca_up", function: "1000000.0 if z < 0 else 0.0" }

  blocks:
    - { molecule: na_lo, N: {{ k }},        active: {{ k }}, insert: !RandomAtomPos { directions: xy } }
    - { molecule: na_up, N: {{ k }},        active: {{ k }}, insert: !RandomAtomPos { directions: xy } }
    - { molecule: ca_lo, N: {{ ca_slots }}, active: 0,       insert: !RandomAtomPos { directions: xy } }
    - { molecule: ca_up, N: {{ ca_slots }}, active: 0,       insert: !RandomAtomPos { directions: xy } }

propagate:
  seed: !Fixed 42
  criterion: Metropolis
  steps: {{ steps }}
  collections:
    - !Stochastic
      cycles: {{ total_charge }}      # trial moves per step
      moves:
        - !TranslateMolecule { molecule: na_lo, dp: {{ dp }}, weight: {{ k }} }
        - !TranslateMolecule { molecule: na_up, dp: {{ dp }}, weight: {{ k }} }
        - !TranslateMolecule { molecule: ca_lo, dp: {{ dp }}, weight: {{ ca_slots }} }
        - !TranslateMolecule { molecule: ca_up, dp: {{ dp }}, weight: {{ ca_slots }} }
        # 2 Na⁺ ⇌ Ca²⁺ per half (charge-conserving); dG sets the composition.
        - !SpeciationMove
          weight: {{ (total_charge / 10) | int }}
          reactions:
            - ["na_lo + na_lo = ca_lo", !dG {{ dG }}]
            - ["na_up + na_up = ca_up", !dG {{ dG }}]

analysis:
  - !DoubleLayerPressure { selection: "atomtype Na Ca", file: pressure.csv, frequency: !Every 1 }
  - !CollectiveVariable { property: molarity, selection: "atomtype Na", file: molarity_na.dat, frequency: !Every 1 }
  - !CollectiveVariable { property: molarity, selection: "atomtype Ca", file: molarity_ca.dat, frequency: !Every 1 }
  - !Energy { file: energy.dat, frequency: !Every 100 }
