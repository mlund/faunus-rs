# Ideal-gas Gibbs ensemble used only to pin down reproducibility.
#
# `energy: {}` makes every configuration degenerate, so this says nothing about
# physics; it runs in milliseconds and fails the moment a seeded run stops
# repeating itself. Both the starting coordinates (`insert:`) and the inter-box
# moves must be driven by `propagate.seed`.

atoms:
  - {name: X, mass: 1.0, sigma: 1.0}

molecules:
  - name: particle
    atoms: [X]

system:
  cell: !Cuboid [10.0, 10.0, 10.0]
  medium:
    permittivity: !Vacuum
    temperature: 298.15
  energy: {}
  blocks:
    - molecule: particle
      N: 40
      active: 20
      insert: !RandomAtomPos {}

analysis: []

propagate:
  seed: !Fixed 7
  criterion: Metropolis
  repeat: 50
  collections:
    - !Stochastic
      moves:
        - !TranslateMolecule {molecule: particle, max_displacement: 0.5, repeat: 5}
  gibbs:
    intra_steps: 1
    moves:
      - !GibbsVolumeExchange {volume_displacement: 0.2}
      - !GibbsParticleTransfer {molecule: particle}
