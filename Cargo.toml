[workspace]
resolver = "2"
members = [
    "faunus",
    "duello",
    "duello-web",
    "icotable",
    "coulomb",
    "interatomic",
    "cgkitten",
]

# Redirect git dependencies to local workspace checkouts
[patch."https://github.com/mlund/faunus-rs.git"]
faunus = { path = "faunus" }

[patch."https://github.com/mlund/interatomic.git"]
interatomic = { path = "interatomic" }

[patch."https://github.com/mlund/icotable.git"]
icotable = { path = "icotable" }

[patch."https://github.com/mlund/duello.git"]
duello = { path = "duello" }

# Redirect crates.io dependencies to local workspace checkouts
[patch.crates-io]
coulomb = { path = "coulomb" }

[profile.release]
#strip = true

# Unoptimised float code dominates `cargo test`: the rotational-diffusion and
# molecule-swap tests account for nearly all of an 8.5 s run. Optimising the
# test profile takes that to 0.5 s and keeps debug assertions enabled.
[profile.test]
opt-level = 2
